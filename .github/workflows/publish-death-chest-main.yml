name: Publish DeathChest Main
on:
  push:
    branches: [main]
    paths-ignore:
      - 'build-output/**'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Build DeathChest
        working-directory: death-chest
        run: mvn -B package
      - name: Publish JAR
        run: |
          mkdir -p build-output
          cp death-chest/target/DeathChest-1.0.0.jar build-output/DeathChest-1.0.0.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-output/DeathChest-1.0.0.jar
          git diff --cached --quiet || git commit -m "Publish DeathChest 1.0.0 JAR"
          git push

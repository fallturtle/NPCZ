name: Build DeathChest
on:
  push:
    branches: [death-chest-plugin]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Build
        working-directory: death-chest
        run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: DeathChest-1.0.0
          path: death-chest/target/DeathChest-1.0.0.jar

name: Build NPCZ
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - run: mvn -B package
      - name: Publish JAR
        run: |
          mkdir -p release
          cp target/npcz-1.0.3.jar release/NPCZ-1.0.3.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/NPCZ-1.0.3.jar
          git commit -m "Publish NPCZ 1.0.3 JAR" || exit 0
          git push

name: Build NPCZ
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - run: mvn -B package
      - name: Build DeathChest
        working-directory: death-chest
        run: mvn -B package
      - name: Upload NPCZ JAR
        uses: actions/upload-artifact@v4
        with:
          name: NPCZ-1.0.4
          path: target/npcz-1.0.4.jar
      - name: Upload DeathChest JAR
        uses: actions/upload-artifact@v4
        with:
          name: DeathChest-1.0.0
          path: death-chest/target/deathchest-1.0.0.jar

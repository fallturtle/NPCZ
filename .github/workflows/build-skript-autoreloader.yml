name: Build SkriptAutoReloader

on:
  push:
    paths:
      - "skript-autoreloader/**"
      - ".github/workflows/build-skript-autoreloader.yml"
  pull_request:
    paths:
      - "skript-autoreloader/**"
      - ".github/workflows/build-skript-autoreloader.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - name: Build
        working-directory: skript-autoreloader
        run: mvn -B package
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SkriptAutoReloader-1.0.0
          path: skript-autoreloader/target/*.jar
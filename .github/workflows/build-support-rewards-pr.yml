name: Build ServerSupportRewards PR
on:
  pull_request:
    paths:
      - 'support-rewards/**'
      - '.github/workflows/build-support-rewards-pr.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: support-rewards
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: ServerSupportRewards-1.0.0-pr
          path: support-rewards/target/ServerSupportRewards-1.0.0.jar
          if-no-files-found: error